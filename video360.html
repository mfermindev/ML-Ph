<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MILU · Playa 360°</title><script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script><style>body{margin:0;font-family:Arial,sans-serif}#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:12px}button,a{background:#a8bfa3;border:0;border-radius:24px;padding:12px 18px;color:#23352b;text-decoration:none;cursor:pointer;white-space:nowrap}#status{position:fixed;top:14px;left:14px;z-index:1000;color:white;background:#0008;padding:8px;border-radius:8px}</style></head><body><div id="status">Arrastrá para mirar alrededor. Tocá Reproducir.</div><a-scene><a-assets timeout="60000"><video id="beach-video" src="assets/videos/360/beach360.mp4" crossorigin="anonymous" playsinline webkit-playsinline preload="metadata" loop></video></a-assets><a-videosphere src="#beach-video"></a-videosphere><a-camera look-controls="touchEnabled: true; mouseEnabled: true"></a-camera></a-scene><div id="controls"><button id="play">▶ Reproducir</button><a href="index.html#inmersivo">← Volver</a></div><script>const video=document.getElementById('beach-video'),button=document.getElementById('play'),status=document.getElementById('status');button.addEventListener('click',async()=>{try{if(video.paused)await video.play();else video.pause()}catch(e){status.textContent='No se pudo reproducir beach360.mp4. Revisá el archivo y su codificación (H.264).';console.error(e)}});video.addEventListener('play',()=>button.textContent='❚❚ Pausar');video.addEventListener('pause',()=>button.textContent='▶ Reproducir');video.addEventListener('error',()=>status.textContent='No se encuentra o no se puede decodificar assets/videos/360/beach360.mp4');</script></body></html>
